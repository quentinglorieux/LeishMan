site_name: LeishMan website guide
site_description: How to edit the LeishMan network website and how its private working-group documents work
site_url: https://docs.leishman-network.org/
repo_url: https://github.com/quentinglorieux/LeishMan
repo_name: quentinglorieux/LeishMan
edit_uri: edit/main/docs/docs/
copyright: LeishMan network

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue
      accent: light green
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: blue
      accent: light green
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  icon:
    logo: material/account-group

nav:
  - Home: index.md
  - For group members:
      - Reading your group's documents: members/documents.md
  - For editors:
      - Signing in to the editor: editors/getting-started.md
      - Working groups: editors/working-groups.md
      - Members: editors/members.md
      - Who can read which documents: editors/access.md
      - Files on Nextcloud: editors/files.md
      - Other content: editors/other-content.md
  - For administrators:
      - How the website works: admin/architecture.md
      - Deployment: admin/deployment.md
      - Security notes: admin/security.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
