  #     - { label: "Title", name: "title", widget: "string", required: true }
  #     - {
  #         label: "File",
  #         name: "file",
  #         widget: "file",
  #         required: true,
  #       }
  - label: Access & roles
    name: users
    icon: admin_panel_settings
    description: >-
      Working-group members get access to their group's documents automatically (Working groups >
      Members). Use these lists only for administrators (full access + editing the website) and for
      extra access given to people who are not members of the group.
    is_admin: true
    identifier_field: lastname
    files:
      - label: "Administrators"
        name: "admin"
        file: "nuxt-app/public/data/users/admin.yml"
        fields:
          - label: "Administrators"
            name: "admin_list"
            widget: "list"
            summary: "{{fields.lastname}}, {{fields.firstname}} ({{fields.orcid}})"
            collapsed: true
            hint: "Administrators can edit the whole website and read every folder."
            fields:
              - { label: "Last name", name: "lastname", widget: "string", required: true }
              - { label: "First name", name: "firstname", widget: "string", required: false }
              - { label: "E-mail", name: "email", widget: "string", required: false }
              - { label: "ORCID iD", name: "orcid", widget: "string", required: true, pattern: ['^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$', "Format: 0000-0002-1825-0097"] }
              - { label: "Groups (informative, admins see every folder)", name: "group", widget: "select", options: ["Biobanking", "Diagnostic-procedure", "Epidemiology", "LC-treatment", "VL-treatment", "Recommendations", "Admin"], multiple: true, required: false }
      - label: "Extra access (non-members)"
        name: "viewer"
        file: "nuxt-app/public/data/users/viewer.yml"
        fields:
          - label: "People with extra read access"
            name: "viewer_list"
            widget: "list"
            summary: "{{fields.lastname}}, {{fields.firstname}}"
            collapsed: true
            hint: "Read access to the selected group folders, in addition to the group members."
            fields:
              - { label: "Last name", name: "lastname", widget: "string", required: true }
              - { label: "First name", name: "firstname", widget: "string", required: false }
              - { label: "E-mail", name: "email", widget: "string", required: false }
              - { label: "ORCID iD", name: "orcid", widget: "string", required: true, pattern: ['^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$', "Format: 0000-0002-1825-0097"] }
              - { label: "Folders", name: "group", widget: "select", options: ["Biobanking", "Diagnostic-procedure", "Epidemiology", "LC-treatment", "VL-treatment", "Recommendations"], multiple: true }
