backend:
  name: github
  repo: quentinglorieux/leishman # Path to your GitHub repository
  # base_url: https://orcid-sveltia.quentin-glorieux.workers.dev  # Your Cloudflare Worker
  commit_messages:
    create: Create - {{collection}} “{{slug}}”
    update: Update - {{collection}} “{{slug}}”
    delete: Delete - {{collection}} “{{slug}}”
    uploadMedia: Upload - “{{path}}”
    deleteMedia: Delete - “{{path}}”
    openAuthoring: "{{message}}"
  skip_ci: false

media_folder: nuxt-app/public/images
public_folder: /assets/images
show_preview_links: false
superadmin: false
# Logo shown on the CMS sign-in page and in the toolbar (replaces the Sveltia logo)
logo_url: /assets/general/logo.webp

# LeishMan customisations of Sveltia CMS (see sveltia-src/)
sveltia:
  orcid:
    authURL: "https://orcid-sveltia.quentin-glorieux.workers.dev/auth/orcid"
    origin: "https://orcid-sveltia.quentin-glorieux.workers.dev"
  nextcloudWorkerBase: "https://nextcloud-leishman.quentin-glorieux.workers.dev"
# editor:
#   preview: true

collections:
  # ------------------------------------------------------------------ Working groups
  - label: Working groups
    label_singular: Working group
    description: >-
      One entry per working group. The member list below is shown on the group page AND
      decides who can open the group's private documents (members need an ORCID iD on
      their member page). Changes are live a few minutes after saving.
    is_admin: true
    name: projects
    icon: workspaces
    folder: nuxt-app/content/projects
    media_folder: /nuxt-app/public/assets/projects
    public_folder: /assets/projects
    create: true
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - { label: "Title", name: "title", widget: "string", required: true, hint: "Also used in the page address: avoid changing it once published." }
      - {
          label: "Short description",
          name: "shortdescription",
          widget: "markdown",
          required: false,
          hint: "Shown on the working groups list and at the top of the group page.",
        }
      - {
          label: "Additional description",
          name: "description",
          widget: "markdown",
          required: false,
          hint: "Optional longer text. Do NOT list members here: use the Members field below.",
        }
      - { label: "Image", name: "image", widget: "image", required: false }
      - {
          label: "Documents folder (Nextcloud)",
          name: "folder",
          widget: "select",
          required: false,
          options: ["Biobanking", "Diagnostic-procedure", "Epidemiology", "LC-treatment", "VL-treatment", "Recommendations", "LC recommendations", "Consortium"],
          hint: "Top-level Nextcloud folder whose content is shown to the group members. Ask the website manager to create a new folder if needed.",
        }
      - label: "Members"
        name: "members"
        widget: "list"
        required: false
        add_to_top: false
        collapsed: true
        summary: "{{fields.member}}{{fields.leader | ternary(' (group leader)', '')}}"
        hint: "Pick people from the Members collection. Group leaders are shown first. Create the member page first if the person is missing."
        fields:
          - label: "Member"
            name: "member"
            widget: "relation"
            collection: "members"
            value_field: "{{slug}}"
            search_fields: ["lastname", "firstname", "laboratory"]
            display_fields: ["{{firstname}} {{lastname}}"]
          - { label: "Group leader", name: "leader", widget: "boolean", default: false, required: false }
      - { label: "URL slug (technical)", name: "slug", widget: "string", required: false, hint: "Short technical name. Leave as is." }

  # ------------------------------------------------------------------ Members
  - label: Members
    label_singular: Member
    description: >-
      Everyone in the network: steering committee and working-group members.
      Add the ORCID iD so the person can sign in and read their groups' documents.
    name: members
    icon: group
    is_admin: true
    folder: nuxt-app/content/members
    media_folder: /nuxt-app/public/assets/members
    public_folder: /assets/members
    create: true
    identifier_field: lastname
    slug: "{{firstname}}-{{lastname}}"
    fields:
      - { label: "Last name", name: "lastname", widget: "string", required: true }
      - { label: "First name", name: "firstname", widget: "string", required: true }
      - {
          label: "ORCID iD",
          name: "orcid",
          widget: "string",
          required: false,
          pattern: ['^$|^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$', "Format: 0000-0002-1825-0097 (without https://orcid.org/)"],
          hint: "Needed to sign in. Find it on https://orcid.org (format 0000-0000-0000-0000).",
        }
      - {
          label: "Institution",
          name: "laboratory",
          widget: "string",
          required: false,
          hint: "e.g. Instituto de Salud Carlos III, Madrid, Spain",
        }
      - {
          label: "Photo",
          name: "thumbnail",
          widget: "image",
          required: false,
          hint: "Square picture, at least 300×300 px. Initials are shown when empty.",
        }
      - { label: "Title / role", name: "role", widget: "string", required: false, hint: "e.g. MD, PhD" }
      - { label: "E-mail", name: "mail", widget: "string", required: false, hint: "Shown publicly on the Steering committee and Contact pages only." }
      - {
          label: "Short bio",
          name: "shortbio",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Steering committee",
          name: "steering",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Show on the Steering committee page.",
        }
      - {
          label: "Coordinator",
          name: "coordinator",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Show on the Contact page.",
        }
    summary: "{{lastname}}, {{firstname}}{{laboratory | ternary(' · ', '')}}{{laboratory}}"
    sortable_fields: [lastname, firstname, laboratory]
    view_filters:
      - { label: "Steering committee", field: steering, pattern: true }
      - { label: "Without ORCID iD", field: orcid, pattern: '^$' }
  - label: Collaborations
    is_admin: true
    name: collaborations
    icon: diversity_3
    folder: nuxt-app/content/collaborations
    media_folder: /nuxt-app/public/assets/collaborations
    public_folder: /assets/collaborations
    create: true
    identifier_field: institution
    fields:
      - {
          label: "Institution",
          name: "institution",
          widget: "string",
          required: true,
        }
      - {
          label: "Short Description",
          name: "shortdescription",
          widget: "markdown",
          required: false,
        }
      
      - { label: "Link", name: "lien", widget: "string", required: false }
      - {
          label: "Featured Image",
          name: "image",
          widget: "image",
          required: false,
        }
