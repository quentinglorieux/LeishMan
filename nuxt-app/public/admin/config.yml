  - label: Pages and Settings
    name: pages
    icon: settings
    is_admin: true
    media_folder: /nuxt-app/public/assets/general
    public_folder: /assets/general
    files:
      - label: "Home"
        name: "home"
        file: "nuxt-app/content/pages/index.yml"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - {
              label: "Description",
              name: "description",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Featured Image",
              name: "thumbnail",
              widget: "image",
              required: false,
            }
      - label: "About"
        name: "about"
        file: "nuxt-app/public/data/pages/about.yml"
        fields:
          - {
              label: "Title1",
              name: "title1",
              widget: "string",
              required: true,
            }
          - {
              label: "Description1",
              name: "description1",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Title2",
              name: "title2",
              widget: "string",
              required: true,
            }
          - {
              label: "Description2",
              name: "description2",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Title3",
              name: "title3",
              widget: "string",
              required: true,
            }
          - {
              label: "Description3",
              name: "description3",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Title4",
              name: "title4",
              widget: "string",
              required: true,
            }
          - {
              label: "Description4",
              name: "description4",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Consortium Agreement",
              name: "manual_pdf",
              widget: "file",
            }
      - label: "Contact"
        name: "contact"
        file: "nuxt-app/public/data/pages/contact.yml"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - {
              label: "Description",
              name: "description",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Featured Image",
              name: "thumbnail",
              widget: "image",
              required: false,
            }
  - label: Gallery
    name: gallery
    icon: image
    media_folder: /nuxt-app/public/assets/gallery 
    public_folder: /assets/gallery
    is_admin: true
    files:
      - label: "Gallery"
        name: "gallery"
        file: "nuxt-app/content/gallery.yml"
        media_folder: /nuxt-app/public/assets/gallery 
        public_folder: /assets/gallery
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - label: "Pictures"
            name: "pictureList"
            widget: "list"
            fields:
              - {
                  label: "image",
                  name: "image",
                  widget: "image",
                  required: false,
                }
  # - label: Documents
  #   name: documents
  #   icon: description
  #   is_admin: true
  #   folder: nuxt-app/content/documents
  #   media_folder: /nuxt-app/public/assets/documents 
  #   public_folder: /assets/documents
