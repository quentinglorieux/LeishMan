  - label: News
    name: news
    icon: brand_awareness
    folder: nuxt-app/content/news
    media_folder: /nuxt-app/public/assets/news
    public_folder: /assets/news
    create: true
    identifier_field: title
    is_admin: true
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - {
          label: "Short Description",
          name: "shortdescription",
          widget: "string",
          required: false,
        }
      - {
          label: "Long Description",
          name: "longdescription",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Featured Image",
          name: "image",
          widget: "image",
          required: false,
        }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          time_format: false,
          date_format: "DD:MM:YYYY",
          format: "DD/MM/YYYY",
          required: false,
        }
  - label: Publications
    name: publications
    icon: library_books
    folder: nuxt-app/content/publications
    create: true
    is_admin: true
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Authors", name: "authors", widget: "string", required: true }
      - { label: "Journal", name: "journal", widget: "string" }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Volume", name: "volume", widget: "string", required: false }
      - { label: "DOI or link", name: "DOI", widget: "string", required: false }
      - { label: "PubMedId", name: "pmid", widget: "string", required: false }
  - label: Events
    name: events
    icon: event
    folder: nuxt-app/content/events
    media_folder: /nuxt-app/public/assets/events
    public_folder: /assets/events    
    create: true
    is_admin: true
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - {
          label: "Location",
          name: "location",
          widget: "string",
          required: false,
        }
      - {
          label: "Description",
          name: "description",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Program PDF",
          name: "program_pdf",
          widget: "file",
          required: false,
        }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          time_format: false,
          date_format: "DD:MM:YYYY",
          format: "DD/MM/YYYY",
          required: false,
        }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Talk"
        name: "talk"
        widget: "list"
        required: false
        fields:
          - {
              label: "Speaker",
              name: "speaker",
              widget: "string",
              required: false,
            }
          - {
              label: "Title",
              name: "talktitle",
              widget: "string",
              required: false,
            }
          - {
              label: "Starting Time",
              name: "starttime",
              widget: "datetime",
              time_format: "HH:mm",
              default: "{{now}}",
              date_format: false,
              required: false,
            }
          - {
              label: "Ending Time",
              name: "endingtime",
              widget: "datetime",
              time_format: "HH:mm",
              default: "{{now}}",
              date_format: false,
              required: false,
            }

          - { label: "Topic", name: "topic", widget: "string", required: false }
  - label: Reference Centers
    name: refcenters
    icon: hub
    folder: nuxt-app/content/laboratories
    create: true
    is_admin: true
    identifier_field: name
    fields:
      - { label: "Institution", name: "name", widget: "string", required: true }
      - { label: "Longitude", name: "lng", widget: "string", required: true }
      - { label: "Latitude", name: "lat", widget: "string", required: true }
      - { label: "Country", name: "country", widget: "string", required: true }
      - { label: "City", name: "city", widget: "string", required: true }
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - {
          label: "Description",
          name: "description",
          widget: "markdown",
          required: false,
        }
  # - label: Gallery
  #   name: gallery
  #   folder: nuxt-app/content/gallery
  #   media_folder: /nuxt-app/public/assets/gallery 
  #   public_folder: /assets/gallery
  #   create: true
  #   identifier_field: title
